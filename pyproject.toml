[project]
name = "context-flow-cli"
version = "0.1.0"
description = "A CLI tool to setup an optimized mdflow environment with Context Engineering and Continuous Claude concepts."
authors = [{name = "Jules", email = "jules@example.com"}]
dependencies = [
    "click",
    "jinja2",
    "pyyaml"
]
requires-python = ">=3.10"

[project.scripts]
context-flow = "context_flow.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_flow"]
